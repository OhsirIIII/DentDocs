services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dentdocs_mock
      POSTGRES_USER: dentdocs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentdocs -d dentdocs_mock"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      DENTDOCS_MODE: mock
      DATABASE_URL: postgresql+psycopg://dentdocs:${POSTGRES_PASSWORD}@db:5432/dentdocs_mock
      FILE_ROOT: /data/files
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:?Set FILE_ENCRYPTION_KEY in .env}
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
volumes:
  database:
  files:
