server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 21m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
